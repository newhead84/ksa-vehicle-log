name: Sync Google Calendar (전용차량 휴가 일정 양방향 동기화)

# 방향1(시스템→구글): 수행기사 입력페이지에서 등록한 휴가 일정(연차/반차)을
#   회사 공용 구글 캘린더에 반영합니다. Firebase가 원본(source of truth).
# 방향2(구글→시스템): 구글 캘린더의 일반 일정(회의 등)을 Firebase에 캐싱해
#   대시보드 등에서 참고용으로 표시할 수 있게 합니다. 구글이 원본(source of truth).
#
# 인증: 관리자(회사 공용 구글 계정)가 최초 1회 OAuth 동의로 발급받은 refresh token을
#   GitHub Secrets에 저장해두면, 이 워크플로우가 서비스 계정처럼 자동으로 계속 갱신하며 사용합니다.
#   (refresh token 자체는 브라우저/클라이언트 코드 어디에도 노출되지 않음)
#
# Firebase 쪽 인증은 클라이언트 HTML의 "브라우저 API 키 + 익명 로그인" 방식이 아니라
#   Firebase 서비스 계정(관리자 자격 증명, 보안 규칙 우회)을 사용합니다 — 브라우저 키에
#   걸려있는 HTTP 리퍼러 제한 때문에 서버(GitHub Actions) 요청은 그 방식으로는 차단됩니다.
#
# 필요한 GitHub Secrets:
#   GCAL_CLIENT_ID, GCAL_CLIENT_SECRET, GCAL_REFRESH_TOKEN — 구글 OAuth (get_refresh_token.py로 발급)
#   FIREBASE_URL — 기존 워크플로우(update-fuel-price 등)와 동일한 값 재사용
#   FIREBASE_SERVICE_ACCOUNT_JSON — Firebase 콘솔 > 프로젝트 설정 > 서비스 계정 > 새 비공개 키 생성 (JSON 전체)
# 선택 Secret:
#   GCAL_CALENDAR_ID — 특정 캘린더를 쓰고 싶을 때만 지정(미지정 시 공용 계정의 기본 캘린더 사용)

on:
  # 2026-08-23: 전용차량 모바일 운행 연동 정지로 인해 자동 스케줄 중지.
  # 재개 시 아래 schedule 블록의 주석을 해제할 것.
  # schedule:
  #   # GitHub Actions 예약 워크플로우의 최소 간격은 5분 — 이보다 짧게 지정해도(예: */1)
  #   # GitHub가 실제로는 5분 미만으로 실행해주지 않으므로 5분이 실질적인 하한선.
  #   - cron: '*/5 * * * *'    # 5분마다 실행
  workflow_dispatch: {}

jobs:
  gcal-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-auth requests

      - name: Run Google Calendar sync
        env:
          GCAL_CLIENT_ID: ${{ secrets.GCAL_CLIENT_ID }}
          GCAL_CLIENT_SECRET: ${{ secrets.GCAL_CLIENT_SECRET }}
          GCAL_REFRESH_TOKEN: ${{ secrets.GCAL_REFRESH_TOKEN }}
          GCAL_CALENDAR_ID: ${{ secrets.GCAL_CALENDAR_ID }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/gcal_sync.py
